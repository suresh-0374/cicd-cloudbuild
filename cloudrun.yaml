apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: my-service-name  # This is the actual name of the service in GCP
spec:
  template:
    spec:
      containers:
      - image: my-app-image  # LEAVE THIS AS A PLACEHOLDER
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
